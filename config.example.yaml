# Copiar a config.yaml y rellenar con las rutas locales.
# config.yaml esta en .gitignore: no se sube al repositorio.

paths:
  cov_dir:      "/ruta/a/results_methylseq/bismark/methylation_calls/methylation_coverage"
  samplesheet:  "/ruta/privada/samplesheet.csv"
  reference:    "references/GRCh38"
  out_tables:   "results/tables"
  out_figures:  "results/figures"

bsseq:
  min_coverage: 5        # cobertura minima por CpG y muestra
  min_samples:  0.8      # fraccion de muestras que deben pasar el filtro
  collapse_strand: true  # unir las dos hebras del mismo CpG

dss:
  smoothing: true
  smoothing_span: 500
  dml_pvalue: 0.001
  dmr_pvalue: 0.01
  dmr_min_cpgs: 5
  dmr_min_len: 100
  dmr_pct_sig: 0.5

covariates:
  - age
  - sex

groups:
  case:    "AD"
  control: "CT"
